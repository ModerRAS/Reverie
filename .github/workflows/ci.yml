name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 使用stable版本以获得最佳的依赖兼容性
  RUST_VERSION: "stable"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build all crates
        run: cargo build --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Generate audio fixtures
        run: cargo run -p reverie-storage --bin generate-audio-fixtures -- --output tests/fixtures/audio/
      - name: Run tests
        run: cargo test --all-targets
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./target/debug/lcov.info
          fail_ci_if_error: false

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install npm dependencies
        run: npm ci
        working-directory: tests/e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Generate audio fixtures
        run: cargo run -p reverie-storage --bin generate-audio-fixtures -- --output tests/fixtures/audio/
      - name: Build reverie-server
        run: cargo build -p reverie-server
      - name: Start reverie-server
        run: cargo run -p reverie-server &
        env:
          RUST_LOG: warn
      - name: Wait for server to be ready
        run: |
          for i in {1..60}; do
            if curl -s http://127.0.0.1:4533/rest/ping?f=json > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1
      - name: Run Playwright tests
        run: npm test
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4533
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/report/
          retention-days: 7

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Generate documentation
        run: cargo doc --no-deps
      - name: Deploy documentation
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
