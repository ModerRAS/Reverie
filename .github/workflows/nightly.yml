name: Nightly Release

on:
  # Daily at 00:00 UTC, but only publish release if there are code changes
  schedule:
    - cron: '0 0 * * *'
  # Also build on code push
  push:
    branches: [main, master]
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.75"
  RUST_NIGHTLY: "nightly"

jobs:
  nightly:
    name: Nightly Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes since last nightly
        id: check_changes
        run: |
          # Get the most recent nightly tag
          last_tag=$(git tag --list 'nightly-*' --sort=-v:refname | head -n1)
          if [ -z "$last_tag" ]; then
            # No previous tag, treat as first build
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "First nightly build"
          else
            # Count commits since last tag
            commits=$(git log $last_tag..HEAD --oneline | wc -l)
            echo "Commits since $last_tag: $commits"
            if [ "$commits" -gt 0 ]; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Install Rust ${{ env.RUST_NIGHTLY }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: rust-src, rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install cargo-outdated
        uses: taiki-e/install-action@cargo-outdated

      - name: Update dependencies
        run: cargo update

      - name: Run outdated check
        continue-on-error: true
        run: cargo outdated --exit-code 1 || echo "Outdated dependencies found"

      - name: Run security audit
        continue-on-error: true
        run: cargo audit --deny warnings || echo "Audit issues found"

      - name: Run nextest
        run: cargo nextest --all-features --all-targets

      - name: Build release binaries
        run: |
          cargo build --release --all-features --all-targets
          
      - name: Create release artifacts
        run: |
          mkdir -p artifacts
          cp target/release/reverie artifacts/ 2>/dev/null || true
          cp target/release/reverie-* artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT
          fi
          echo "version=${{ steps.version.outputs.version }}"

      - name: Create GitHub Release (only if there are changes)
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ steps.version.outputs.version }}
          name: Nightly Release ${{ steps.version.outputs.version }}
          body: |
            ## Nightly Build
            
            - Rust Version: ${{ env.RUST_NIGHTLY }}
            - Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
            
            ### Changes
            Automatic nightly build from main branch.
            
            ### Binaries
            - reverie-server binary included
          files: artifacts/**
          prerelease: true

      - name: Push nightly tag (only if there are changes)
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a nightly-${{ steps.version.outputs.version }} -m "Nightly release ${{ steps.version.outputs.version }}"
          git push origin nightly-${{ steps.version.outputs.version }}

      - name: No changes since last release
        if: steps.check_changes.outputs.has_changes == 'false'
        run: echo "No code changes since last nightly release, skipping release creation"

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: nightly
    # Only run benchmarks if there were changes
    if: needs.nightly.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_NIGHTLY }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: rust-src

      - name: Install cargo-benchcmp
        uses: taiki-e/install-action@cargo-benchcmp

      - name: Run benchmarks
        run: |
          cargo bench --all-features --all-targets -- --output-format bencher | tee bench_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench_results.txt
